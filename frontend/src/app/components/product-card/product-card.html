<div class="card">
  <h3>{{ product.name }}</h3>
  <img
    [src]="product.image"
    [alt]="'Image de ' + product.name"
    loading="lazy"
  >

  <button
    (click)="add(product._id)"
    [attr.aria-label]="'Ajouter ' + product.name + ' au panier'"
    type="button"
  >
    Ajouter au panier
  </button>
</div>
